<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Build Readiness Roadmap — AKRD</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="styles.min.css?v=20260729a">
<style>
:root{
  --navy:#0a1d3b; --cyan:#2457ff; --sage:#b7e33f; --warm:#f8fafc; --ink:#06101c; --paper:#e9edf1;
  --line: rgba(6,16,28,0.10); --line-strong: rgba(6,16,28,0.18);
  --amber:#E0A83E; --red:#DD5A4A;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Instrument Sans',sans-serif;-webkit-font-smoothing:antialiased;}
.wrap{max-width:760px;margin:0 auto;padding:44px 24px 100px;}

.top-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--cyan);margin:0 0 8px;}
.top-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:28px;color:var(--navy);margin:0 0 6px;line-height:1.1;}
.top-sub{font-family:'Instrument Sans',sans-serif;font-style:italic;font-size:15px;color:rgba(8,12,18,0.6);margin:0 0 28px;}

.text-input{
  width:100%;font-family:'Instrument Sans',sans-serif;font-size:15px;
  border:1.5px solid var(--line-strong);border-radius:8px;padding:12px 14px;background:#fff;color:var(--ink);
}
.text-input:focus{outline:none;border-color:var(--cyan);}

/* --- header / tabs (returning visitor) --- */
.tool-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.back-link{font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(8,12,18,0.5);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;}
.tab-row{display:flex;gap:6px;margin-bottom:24px;}
.tab-btn{
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.05em;text-transform:uppercase;
  background:#fff;border:1px solid var(--line-strong);color:var(--navy);padding:9px 16px;border-radius:7px;cursor:pointer;
}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}

/* --- intake question card --- */
.progress-track{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:8px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--sage));border-radius:4px;transition:width 0.25s ease;}
.progress-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(8,12,18,0.5);margin-bottom:24px;}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:30px 30px 26px;}
.section-tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--sage);margin:0 0 10px;}
.q-prompt{font-family:'Instrument Sans',sans-serif;font-size:20px;font-weight:500;line-height:1.35;color:var(--navy);margin:0 0 8px;}
.q-why{font-size:13.5px;color:rgba(8,12,18,0.6);line-height:1.5;margin:0 0 22px;}
.options{display:flex;flex-direction:column;gap:8px;}
.opt-row{display:flex;gap:8px;flex-wrap:wrap;}
.opt-btn{
  font-family:'Instrument Sans',sans-serif;font-size:14px;font-weight:600;
  border:1.5px solid var(--line-strong);background:#fff;color:var(--ink);
  padding:11px 16px;border-radius:8px;cursor:pointer;transition:all 0.12s ease;
}
.opt-btn:hover{border-color:var(--cyan);}
.opt-btn.selected{background:var(--navy);border-color:var(--navy);color:#fff;}
.opt-btn.multi.selected{background:var(--sage);border-color:var(--sage);color:var(--ink);}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:26px;}
.nav-btn{
  font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.05em;text-transform:uppercase;
  background:var(--navy);color:#fff;border:none;padding:11px 20px;border-radius:7px;cursor:pointer;
}
.nav-btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line-strong);}
.nav-btn:disabled{opacity:0.35;cursor:default;}
.skip-note{font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(8,12,18,0.4);}

/* --- roadmap --- */
.rm-summary{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:24px;}
.rm-pitch{font-family:'Instrument Sans',sans-serif;font-size:15px;line-height:1.6;color:var(--ink);background:rgba(34,119,209,0.06);border-left:2px solid var(--cyan);padding:14px 16px;border-radius:0 8px 8px 0;margin-top:10px;}
.copy-btn{margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:11px;background:none;border:1px solid var(--line-strong);color:var(--navy);padding:6px 12px;border-radius:6px;cursor:pointer;}

.phase-block{margin-bottom:26px;}
.phase-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.phase-num{
  font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:13px;color:#fff;background:var(--navy);
  width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.phase-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;color:var(--navy);flex:1;}
.phase-bar{width:70px;height:6px;background:var(--line);border-radius:4px;overflow:hidden;}
.phase-bar-fill{height:100%;background:var(--sage);}
.task-row{
  display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:8px;
  padding:11px 14px;margin-bottom:6px;cursor:pointer;
}
.task-status-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);flex-shrink:0;transition:all 0.12s ease;}
.task-row.todo .task-status-dot{background:#fff;}
.task-row.in_progress .task-status-dot{background:var(--amber);border-color:var(--amber);}
.task-row.done .task-status-dot{background:var(--sage);border-color:var(--sage);}
.task-label{flex:1;font-size:13.5px;line-height:1.4;}
.task-row.done .task-label{color:rgba(8,12,18,0.42);text-decoration:line-through;}
.task-status-word{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.04em;text-transform:uppercase;color:rgba(8,12,18,0.4);width:64px;text-align:right;flex-shrink:0;}

.restart-btn{font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(8,12,18,0.45);background:none;border:none;text-decoration:underline;cursor:pointer;padding:0;}
.save-note{font-family:'IBM Plex Mono',monospace;font-size:10px;color:rgba(8,12,18,0.35);margin-top:6px;}

/* --- how it works / intro --- */
.how-it-works{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-bottom:20px;}
.hiw-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;color:var(--navy);margin:0 0 10px;}
.how-it-works ol{margin:0;padding-left:20px;font-size:13.5px;line-height:1.6;color:#26314a;}
.how-it-works ol li{margin-bottom:7px;}
.hiw-note{font-size:11.5px;color:rgba(8,12,18,0.5);margin-top:12px;line-height:1.5;border-top:1px dashed var(--line);padding-top:10px;}
.sample-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;}
.sample-btn{font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:8px 14px;background:transparent;border:1px dashed var(--sage);color:#2f8a63;border-radius:7px;cursor:pointer;}
.sample-btn:hover{background:rgba(95,197,151,0.12);}
.sample-btn.clear{border-color:var(--line-strong);color:rgba(8,12,18,0.55);}
.sample-note{font-size:11.5px;color:rgba(8,12,18,0.5);}
.start-btn{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.04em;text-transform:uppercase;background:var(--navy);color:#fff;border:none;padding:14px 22px;border-radius:10px;cursor:pointer;margin-top:6px;}
.start-btn:hover{background:#1a4a94;}

/* --- notices / privacy --- */
.notice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 20px;margin-bottom:16px;}
.notice-block{background:#fff;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:8px;padding:16px 18px;font-size:12.5px;line-height:1.6;color:#3a4a63;}
.notice-block h3{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:#a8781f;margin:0 0 6px;}
.privacy-note{background:var(--warm);border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-size:12.5px;line-height:1.6;color:#3a4a63;margin-bottom:16px;}
.privacy-note strong{color:var(--navy);}
.contact-line{font-size:12px;color:rgba(8,12,18,0.55);margin-top:4px;}
.contact-line a{color:var(--cyan);}

/* --- glossary --- */
.glossary{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:20px;overflow:hidden;}
.glossary>summary{padding:14px 18px;cursor:pointer;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:15px;color:var(--navy);list-style:none;}
.glossary>summary::-webkit-details-marker{display:none;}
.glossary>summary::before{content:"▸ ";color:var(--cyan);}
.glossary[open]>summary::before{content:"▾ ";}
.glossary-body{padding:0 18px 18px;}
.glossary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:9px 22px;}
.glossary-term{font-size:12.5px;line-height:1.5;color:#3a4a63;}
.glossary-term b{color:var(--navy);font-family:'IBM Plex Mono',monospace;font-size:12px;}

/* --- closing conversation prompt --- */
.talk-block{background:var(--navy);color:#fff;border-radius:12px;padding:22px 24px;margin-top:26px;}
.talk-block h3{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;margin:0 0 6px;}
.talk-block p{font-size:13.5px;line-height:1.6;color:rgba(255,255,255,0.8);margin:0 0 14px;max-width:520px;}
.talk-block a.talk-cta{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.04em;text-transform:uppercase;background:var(--sage);color:#08331f;padding:10px 18px;border-radius:8px;text-decoration:none;}
</style>
</head>

}

// ---------- question engine ----------
function passesShowIf(q, ans){
  const c = q.showIf;
  if(!c) return true;
  const val = ans[c.field];
  if('equals' in c) return val === c.equals;
  if('not_equals' in c) return val !== undefined && val !== c.not_equals;
  if('not_in' in c) return val !== undefined && !c.not_in.includes(val);
  if('includes' in c) return Array.isArray(val) && val.includes(c.includes);
  return true;
}
function getVisible(ans){ return Q.filter(q => passesShowIf(q, ans)); }
function findQ(id){ return Q.find(q=>q.id===id); }
function labelFor(q, val){ if(!q||!q.options) return val; const o=q.options.find(o=>o.value===val); return o?o.label:val; }
function labelsFor(q, vals){ if(!q||!q.options||!vals) return []; return vals.map(v=>labelFor(q,v)).filter(v=>v); }

// ---------- roadmap generation ----------
function buildRoadmap(ans){
  const phases = [];

  const p1 = {title:'Discovery & Assets', tasks:[]};
  p1.tasks.push({id:'basics_confirmed', label:'Confirm business basics (customer, problem, offering, outcome, differentiator)'});
  if(ans.has_logo_files === false) p1.tasks.push({id:'get_logo', label:'Get logo files from client, or scope a logo design'});
  if(ans.brand_colors_defined === false) p1.tasks.push({id:'define_colors', label:'Choose brand colors as part of the build'});
  if(ans.brand_fonts_defined === false) p1.tasks.push({id:'define_fonts', label:'Choose brand fonts as part of the build'});
  if(!ans.media_available || ans.media_available.length===0 || ans.media_available.includes('none_media')) p1.tasks.push({id:'collect_media', label:'Collect or schedule photography/video'});
  if(ans.pricing_documented === false) p1.tasks.push({id:'get_pricing', label:'Get pricing/packages documented from client'});
  if(ans.pricing_display !== 'quote_only' && ans.packages_defined === false) p1.tasks.push({id:'define_packages', label:'Define service/product packages or tiers'});
  if(!ans.proof_available || ans.proof_available.length===0 || ans.proof_available.includes('none_proof')) p1.tasks.push({id:'collect_proof', label:'Collect testimonials, case studies, or certifications'});
  if(ans.owns_domain === false) p1.tasks.push({id:'secure_domain', label:'Help client secure/confirm domain: ' + (ans.domain_choice_needed || 'TBD')});
  phases.push(p1);

  const p2 = {title:'Copy & Structure', tasks:[]};
  p2.tasks.push({id:'draft_pitch', label:'Draft homepage/about pitch from intake answers'});
  p2.tasks.push({id:'finalize_sitemap', label:'Finalize sitemap: ' + (labelsFor(findQ('pages_needed'), ans.pages_needed).join(', ') || 'pages TBD')});
  if(['need_copy','need_copy_photos','scratch'].includes(ans.content_ready)) p2.tasks.push({id:'write_copy', label:'Write full site copy with/for client'});
  if(['need_copy_photos','scratch'].includes(ans.content_ready)) p2.tasks.push({id:'source_photos', label:'Source or shoot remaining photography'});
  phases.push(p2);

  const p3 = {title:'Design', tasks:[]};
  p3.tasks.push({id:'apply_brand', label:'Apply brand colors & fonts to the design system'});
  p3.tasks.push({id:'design_pricing_display', label:'Design pricing section as: ' + (labelFor(findQ('pricing_display'), ans.pricing_display) || 'TBD')});
  if(ans.has_logo_files === false) p3.tasks.push({id:'design_logo', label:'Design the logo'});
  phases.push(p3);

  const p4 = {title:'Build', tasks:[]};
  const funcLabels = labelsFor(findQ('required_functions'), ans.required_functions);
  p4.tasks.push({id:'build_pages', label:'Build core pages'});
  funcLabels.forEach((f,i)=> p4.tasks.push({id:'build_fn_'+i, label:'Build function: ' + f}));
  if(['deposit','checkout'].includes(ans.payment_on_site)) p4.tasks.push({id:'build_payment', label:'Build payment flow: ' + labelFor(findQ('payment_on_site'), ans.payment_on_site)});
  phases.push(p4);

  const p5 = {title:'Leads & Routing', tasks:[]};
  const capLabels = labelsFor(findQ('lead_capture_methods'), ans.lead_capture_methods);
  p5.tasks.push({id:'build_contact', label:'Build contact methods: ' + (capLabels.join(', ') || 'TBD')});
  p5.tasks.push({id:'wire_routing', label:'Wire submissions to: ' + (labelFor(findQ('leads_destination'), ans.leads_destination) || 'TBD') + (ans.crm_name ? ' — '+ans.crm_name : '')});
  p5.tasks.push({id:'test_forms', label:'Test every form on desktop and mobile'});
  phases.push(p5);

  const p6 = {title:'Launch Prep', tasks:[]};
  p6.tasks.push({id:'ssl_check', label:'Confirm SSL/HTTPS active'});
  p6.tasks.push({id:'legal_pages', label:'Publish privacy policy & terms'});
  p6.tasks.push({id:'qa_pass', label:'Full QA pass — desktop, mobile, all browsers'});
  p6.tasks.push({id:'client_signoff', label:'Get client sign-off before going live'});
  phases.push(p6);

  return phases;
}

function taskProgress(phase, ts){
  const total = phase.tasks.length;
  if(total===0) return 0;
  const done = phase.tasks.filter(t=>ts[t.id]==='done').length;
  return Math.round((done/total)*100);
}
function overallProgress(phases, ts){
  let total=0, done=0;
  phases.forEach(p=>p.tasks.forEach(t=>{ total++; if(ts[t.id]==='done') done++; }));
  return total===0?0:Math.round((done/total)*100);
}
function cycleTaskStatus(id){
  const cur = taskStatus[id] || 'todo';
  const next = cur==='todo' ? 'in_progress' : cur==='in_progress' ? 'done' : 'todo';
  taskStatus[id] = next;
  persist();
  renderRoadmap();
}

// ---------- persistence ----------
let saveTimer=null;
function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify({answers,taskStatus,currentQId,intakeCompleted,sampleLoaded}), false); }catch(e){}
  }, 350);
}
async function load(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const d = JSON.parse(res.value);
      answers = d.answers || {};
      taskStatus = d.taskStatus || {};
      currentQId = d.currentQId || Q[0].id;
      intakeCompleted = !!d.intakeCompleted;
      sampleLoaded = !!d.sampleLoaded;
    }
  }catch(e){}
  screen = intakeCompleted ? 'roadmap' : 'intro';
  render();
}

function hasRealData(){
  return Object.keys(answers).some(k=>{
    const v = answers[k];
    if(v === undefined || v === null || v === '') return false;
    if(Array.isArray(v)) return v.length > 0;
    return true;
  });
}

function loadSample(){
  if(hasRealData() && !confirm('This loads example project data so you can preview a finished roadmap — it will overwrite your current answers. Continue?')) return;
  answers = JSON.parse(JSON.stringify(SAMPLE_ANSWERS));
  taskStatus = {};
  sampleLoaded = true;
  intakeCompleted = true;
  currentQId = Q[Q.length-1].id;
  persist();
  screen = 'roadmap';
  render();
}
function clearSample(){
  if(!confirm('Clear the sample data and start over?')) return;
  answers = {}; taskStatus = {}; currentQId = Q[0].id; intakeCompleted = false; sampleLoaded = false;
  persist();
  screen = 'intro';
  render();
}

function switchTab(tab){ screen = tab; render(); }

// ---------- render: intake ----------
function renderTabs(active){
  return `<div class="tab-row">
    <button class="tab-btn ${active==='intake'?'active':''}" onclick="switchTab('intake')">Intake</button>
    <button class="tab-btn ${active==='roadmap'?'active':''}" onclick="switchTab('roadmap')">Roadmap</button>
  </div>`;
}

function renderIntake(){
  const ans = answers;
  const visible = getVisible(ans);
  if(!visible.find(q=>q.id===currentQId)) currentQId = visible[0].id;
  const q = visible.find(v=>v.id===currentQId) || visible[0];
  const idx = visible.findIndex(v=>v.id===q.id);
  const pct = Math.round(((idx+1)/visible.length)*100);

  let inner = '';
  if(q.type === 'yesno'){
    inner += `<div class="opt-row">
      <button class="opt-btn ${ans[q.id]===true?'selected':''}" onclick="setAnswer('${q.id}',true,true)">Yes</button>
      <button class="opt-btn ${ans[q.id]===false?'selected':''}" onclick="setAnswer('${q.id}',false,true)">No</button>
    </div>`;
  } else if(q.type === 'select'){
    inner += `<div class="opt-row">`;
    q.options.forEach(o=>{ inner += `<button class="opt-btn ${ans[q.id]===o.value?'selected':''}" onclick="setAnswer('${q.id}','${o.value}',true)">${o.label}</button>`; });
    inner += `</div>`;
  } else if(q.type === 'multiselect'){
    inner += `<div class="opt-row">`;
    q.options.forEach(o=>{
      const sel = ans[q.id] && ans[q.id].includes(o.value);
      inner += `<button class="opt-btn multi ${sel?'selected':''}" onclick="toggleMulti('${q.id}','${o.value}','${q.negative||''}')">${o.label}</button>`;
    });
    inner += `</div><p class="skip-note" style="margin-top:12px;">Select all that apply, then press Next</p>`;
  } else if(q.type === 'text'){
    inner += `<input class="text-input" type="text" value="${ans[q.id]?String(ans[q.id]).replace(/"/g,'&quot;'):''}" placeholder="Type the answer…" oninput="answers['${q.id}']=this.value;persist();" />`;
  }

  const wrap = document.getElementById('wrap');
  wrap.innerHTML = `
    <div class="tool-header">
      <button class="back-link" onclick="goIntro()">&larr; About this tool</button>
      ${intakeCompleted ? `<button class="back-link" onclick="switchTab('roadmap')">View roadmap →</button>` : ''}
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">Question ${idx+1} of ${visible.length}</div>
    <div class="card">
      <p class="section-tag">${q.section}</p>
      <p class="q-prompt">${q.prompt}</p>
      <p class="q-why">${q.why}</p>
      <div class="options">${inner}</div>
      <div class="nav-row">
        <button class="nav-btn ghost" onclick="goBackQ()" ${idx===0?'disabled':''}>&larr; Back</button>
        <button class="nav-btn" onclick="goNextQ()">${idx===visible.length-1?'Build my roadmap':'Next →'}</button>
      </div>
    </div>
    <div class="save-note">Saves automatically on this device</div>
  `;
}
function setAnswer(id, val, autoAdvance){
  answers[id] = val;
  sampleLoaded = false;
  persist();
  if(autoAdvance){ setTimeout(goNextQ, 180); } else { renderIntake(); }
}
function toggleMulti(id, val, negativeVal){
  let arr = answers[id] ? [...answers[id]] : [];
  if(val === negativeVal){ arr = arr.includes(val) ? [] : [val]; }
  else { arr = arr.filter(v=>v!==negativeVal); if(arr.includes(val)) arr = arr.filter(v=>v!==val); else arr.push(val); }
  answers[id] = arr;
  sampleLoaded = false;
  persist();
  renderIntake();
}
function goNextQ(){
  const visible = getVisible(answers);
  const idx = visible.findIndex(q=>q.id===currentQId);
  if(idx < visible.length-1){ currentQId = visible[idx+1].id; persist(); renderIntake(); }
  else { intakeCompleted = true; persist(); screen='roadmap'; render(); }
}
function goBackQ(){
  const visible = getVisible(answers);
  const idx = visible.findIndex(q=>q.id===currentQId);
  if(idx > 0){ currentQId = visible[idx-1].id; persist(); renderIntake(); }
}

// ---------- render: roadmap ----------
function renderRoadmap(){
  const ans = answers;
  const phases = buildRoadmap(ans);
  const pct = overallProgress(phases, taskStatus);

  const pitch = `We help ${ans.primary_customer || '[best-fit customer]'} solve ${ans.core_problem || '[core problem]'} by providing ${ans.core_offering || '[what they provide]'}, resulting in ${ans.core_outcome || '[the result]'}.` +

    const ppct = taskProgress(p, taskStatus);

      <button class="copy-btn" onclick="copyPitch()">Copy pitch text</button>
    </div>
    ${phasesHtml}
    <button class="restart-btn" onclick="switchTab('intake')">← Edit intake answers</button>

    <div class="rm-summary">
      <p class="report-h" style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--navy);margin:0 0 6px;">Share this roadmap</p>
      ${shareFormOpen ? `
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
          <input class="text-input" style="flex:1;min-width:160px;" type="text" id="shareName" placeholder="Your name">
          <input class="text-input" style="flex:1;min-width:160px;" type="email" id="shareEmail" placeholder="Email">
        </div>
        <button class="copy-btn" onclick="submitShare()">Send to Andrew</button>
        <span class="skip-note" style="margin-left:8px;">${shareStatus}</span>
      ` : `
        <button class="sample-btn" type="button" onclick="toggleShareForm()">Share this roadmap with Andrew</button>
        <span class="skip-note" style="margin-left:8px;">Optional — sends your name, email, and this roadmap. Nothing else leaves your browser.</span>
      `}
    </div>

    <div class="talk-block">
      <h3>Prefer a conversation?</h3>
      <p>This roadmap is a starting point — not a binding plan or quote. If it looks close, the fastest next step is a short call to scope it for real.</p>
      <a class="talk-cta" href="connect.html#schedule" target="_top">Book a free intro call</a>
    </div>
    <div class="hiw-note" style="margin-top:14px;">Informational only — this roadmap is a starting point for a scoped conversation with AK Randall Digital LLC, not a binding project plan, quote, or contract. AK Randall Digital LLC &middot; andrew@akrandall.com &middot; 336&ndash;437&ndash;4484</div>
  `;
  persist();
}
function copyPitch(){
  const text = document.getElementById('pitchText').innerText;
  navigator.clipboard && navigator.clipboard.writeText(text);
}

function render(){
  if(screen==='intro'){ renderIntro(); }
  else if(screen==='intake'){ renderIntake(); }
  else if(screen==='roadmap'){ renderRoadmap(); }
}

load();

/* ---- report height to parent when embedded in an iframe (landing-page wrapper) ---- */

if(window.ResizeObserver){
  new ResizeObserver(reportHeightToParent).observe(document.body);
} else {

}
