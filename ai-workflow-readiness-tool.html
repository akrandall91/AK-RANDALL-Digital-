<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Workflow Readiness Roadmap — AKRD</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="styles.min.css?v=20260729a">
<style>
:root{
  --navy:#0a1d3b; --cyan:#2457ff; --sage:#b7e33f; --warm:#f8fafc; --ink:#06101c; --paper:#e9edf1;
  --line: rgba(6,16,28,0.10); --line-strong: rgba(6,16,28,0.18);
  --red:#DD5A4A; --amber:#E0A83E;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Instrument Sans',sans-serif;-webkit-font-smoothing:antialiased;}
.wrap{max-width:760px;margin:0 auto;padding:40px 24px 100px;}

.top-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--cyan);margin:0 0 8px;}
.top-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:28px;color:var(--navy);margin:0 0 4px;line-height:1.1;}
.top-sub{font-family:'Instrument Sans',sans-serif;font-style:italic;font-size:14.5px;color:rgba(8,12,18,0.6);margin:0 0 26px;}

.overall-card{display:flex;align-items:center;gap:18px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:28px;}
.overall-ring{width:56px;height:56px;flex-shrink:0;}
.overall-ring-text{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:14px;fill:var(--navy);}
.overall-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;color:rgba(8,12,18,0.5);}
.overall-count{font-family:'Instrument Sans',sans-serif;font-size:16px;color:var(--navy);}
.brief-btn{
  margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.05em;text-transform:uppercase;
  background:var(--navy);color:#fff;border:none;padding:10px 16px;border-radius:7px;cursor:pointer;white-space:nowrap;
}

.section-card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;}
.section-head{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;}
.section-num{font-family:'IBM Plex Mono',monospace;font-size:10px;color:rgba(8,12,18,0.35);width:20px;flex-shrink:0;}
.section-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:15.5px;color:var(--navy);flex:1;}
.status-pill{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.05em;text-transform:uppercase;padding:4px 9px;border-radius:20px;flex-shrink:0;}
.pill-not{background:rgba(221,90,74,0.13);color:var(--red);}
.pill-progress{background:rgba(224,168,62,0.15);color:#a8781f;}
.pill-done{background:rgba(95,197,151,0.18);color:#2f8a63;}
.mini-track{width:70px;height:5px;background:var(--line);border-radius:3px;overflow:hidden;flex-shrink:0;}
.mini-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--sage));}
.section-chevron{font-family:'IBM Plex Mono',monospace;color:rgba(8,12,18,0.35);transition:transform 0.15s ease;flex-shrink:0;}
.section-card.open .section-chevron{transform:rotate(90deg);}
.section-body{display:none;padding:4px 20px 20px;border-top:1px solid var(--line);}
.section-card.open .section-body{display:block;}

.field{padding:16px 0;border-bottom:1px solid var(--line);}
.field:last-child{border-bottom:none;}
.field-prompt{font-size:14px;font-weight:600;color:var(--ink);margin:0 0 3px;}
.field-why{font-size:12px;color:rgba(8,12,18,0.5);margin:0 0 10px;line-height:1.45;}
.opt-row{display:flex;gap:7px;flex-wrap:wrap;}
.opt-btn{
  font-family:'Instrument Sans',sans-serif;font-size:13px;font-weight:600;
  border:1.5px solid var(--line-strong);background:#fff;color:var(--ink);
  padding:8px 13px;border-radius:7px;cursor:pointer;transition:all 0.12s ease;
}
.opt-btn:hover{border-color:var(--cyan);}
.opt-btn.selected{background:var(--navy);border-color:var(--navy);color:#fff;}
.opt-btn.multi.selected{background:var(--sage);border-color:var(--sage);color:var(--ink);}
.text-input{
  width:100%;font-family:'Instrument Sans',sans-serif;font-size:14px;
  border:1.5px solid var(--line-strong);border-radius:7px;padding:10px 12px;
  background:#fff;color:var(--ink);
}
.text-input:focus{outline:none;border-color:var(--cyan);}

.file-zone{margin-top:12px;}
.file-btn{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.03em;
  border:1.5px dashed var(--line-strong);background:rgba(34,119,209,0.04);color:var(--navy);
  padding:9px 14px;border-radius:7px;cursor:pointer;display:inline-block;
}
.file-btn:hover{border-color:var(--cyan);}
.file-chip{
  display:inline-flex;align-items:center;gap:8px;background:rgba(95,197,151,0.13);
  border-radius:6px;padding:5px 10px;margin:6px 6px 0 0;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#2f8a63;
}
.file-chip.too-large{background:rgba(224,168,62,0.16);color:#a8781f;}
.file-remove{cursor:pointer;color:rgba(8,12,18,0.4);font-weight:700;}

.footer-tools{display:flex;justify-content:space-between;margin-top:20px;}
.restart-btn{font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(8,12,18,0.45);background:none;border:none;text-decoration:underline;cursor:pointer;padding:0;}
.save-note{font-family:'IBM Plex Mono',monospace;font-size:10px;color:rgba(8,12,18,0.35);}

.report-gauge{display:flex;align-items:center;gap:26px;margin-bottom:28px;}
.gauge-svg{width:120px;height:120px;flex-shrink:0;}
.gauge-score{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;fill:var(--navy);}
.report-level{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--sage);}
.report-level-name{font-family:'Instrument Sans',sans-serif;font-style:italic;font-size:20px;color:var(--navy);}
.report-level-desc{font-size:13.5px;color:rgba(8,12,18,0.65);margin-top:4px;line-height:1.5;}
.report-block{margin-bottom:26px;}
.report-h{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--navy);border-bottom:1px solid var(--line-strong);padding-bottom:8px;margin:0 0 14px;}
.pitch-text{font-family:'Instrument Sans',sans-serif;font-size:15.5px;line-height:1.6;color:var(--ink);background:rgba(34,119,209,0.06);border-left:2px solid var(--cyan);padding:16px 18px;border-radius:0 8px 8px 0;}
.copy-btn{margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:11px;background:none;border:1px solid var(--line-strong);color:var(--navy);padding:6px 12px;border-radius:6px;cursor:pointer;}
.gap-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.gap-dot{width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:6px;flex-shrink:0;}
.gap-body b{font-size:14px;}
.gap-body p{margin:3px 0 0;font-size:13px;color:rgba(8,12,18,0.6);line-height:1.5;}
.gap-section{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.05em;text-transform:uppercase;color:var(--cyan);margin-top:22px;margin-bottom:2px;}

/* ---------- HOW IT WORKS ---------- */
.how-it-works{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-bottom:20px;}
.hiw-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;color:var(--navy);margin:0 0 10px;}
.how-it-works ol{margin:0;padding-left:20px;font-size:13.5px;line-height:1.6;color:#26314a;}
.how-it-works ol li{margin-bottom:7px;}
.hiw-note{font-size:11.5px;color:rgba(8,12,18,0.5);margin-top:12px;line-height:1.5;border-top:1px dashed var(--line);padding-top:10px;}
.sample-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;}
.sample-btn{font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:8px 14px;background:transparent;border:1px dashed var(--sage);color:#2f8a63;border-radius:7px;cursor:pointer;}
.sample-btn:hover{background:rgba(95,197,151,0.12);}
.sample-btn.clear{border-color:var(--line-strong);color:var(--muted,rgba(8,12,18,0.55));}
.sample-note{font-size:11.5px;color:rgba(8,12,18,0.5);}

/* ---------- NOTICES / PRIVACY ---------- */
.notice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 20px;margin-bottom:16px;}
.notice-block{background:#fff;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:8px;padding:16px 18px;font-size:12.5px;line-height:1.6;color:#3a4a63;}
.notice-block h3{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:#a8781f;margin:0 0 6px;}
.privacy-note{background:var(--warm);border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-size:12.5px;line-height:1.6;color:#3a4a63;margin-bottom:16px;}
.privacy-note strong{color:var(--navy);}
.contact-line{font-size:12px;color:rgba(8,12,18,0.55);margin-top:4px;}
.contact-line a{color:var(--cyan);}

/* ---------- GLOSSARY ---------- */
.glossary{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:20px;overflow:hidden;}
.glossary>summary{padding:14px 18px;cursor:pointer;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:15px;color:var(--navy);list-style:none;}
.glossary>summary::-webkit-details-marker{display:none;}
.glossary>summary::before{content:"▸ ";color:var(--cyan);}
.glossary[open]>summary::before{content:"▾ ";}
.glossary-body{padding:0 18px 18px;}
.glossary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:9px 22px;}
.glossary-term{font-size:12.5px;line-height:1.5;color:#3a4a63;}
.glossary-term b{color:var(--navy);font-family:'IBM Plex Mono',monospace;font-size:12px;}
@media (max-width:520px){
  .wrap{padding:28px 14px 80px;}
  .overall-card{flex-wrap:wrap;gap:12px;padding:14px;}
  .brief-btn{margin-left:0;width:100%;white-space:normal;}
  .section-head{gap:8px;padding:14px 12px;}
  .section-name{min-width:0;}
  .status-pill{padding:4px 6px;}
  .mini-track{display:none;}
  .section-body{padding:4px 12px 16px;}
}
</style>
</head>

<script>const RAW = JSON.parse(document.getElementById('qdata').textContent);

function submitLead({name, email, company, focus, message, captureSource}){
  let queryString = window.location.search;
  try{ queryString = window.parent.location.search || queryString; }catch(e){}
  const query = new URLSearchParams(queryString);
  if(!APPS_SCRIPT_URL){
    const lines = [`Name: ${name}`, `Email: ${email}`, company ? `Company: ${company}` : '', '', message].filter(Boolean);
    window.open('mailto:andrew@akrandall.com?subject=' + encodeURIComponent(focus) + '&body=' + encodeURIComponent(lines.join('\n')), '_top');
    return Promise.resolve();
  }
  const payload = new URLSearchParams({
    name, email, company: company || '', focus, message: String(message || '').slice(0, 4000),
    sourcePage: 'ai-workflow-readiness.html',
    referrer: document.referrer,
    utmSource: query.get('utm_source') || '', utmMedium: query.get('utm_medium') || '',
    utmCampaign: query.get('utm_campaign') || '', utmContent: query.get('utm_content') || '', utmTerm: query.get('utm_term') || '',
    submittedAt: new Date().toISOString(),
    captureSource, assessmentIndustry: '', assessmentVariant: '', assessmentCompletion: 'complete', website: ''
  });
  return fetch(APPS_SCRIPT_URL, {method: 'POST', mode: 'no-cors', body: payload});
}
function toggleShareForm(){ shareFormOpen = true; renderReport(); }

const GLOSSARY = [
  {term:"CRM", def:"Customer Relationship Management — the system of record for leads, contacts, and deals (e.g. HubSpot, Salesforce, Pipedrive)."},
  {term:"API", def:"Application Programming Interface — the connection point two pieces of software use to exchange data automatically, without a person copying and pasting between them."},
  {term:"Webhook", def:"A message one system sends automatically to another the moment something happens (e.g. a new lead is created) — the trigger behind most real-time automation."},
  {term:"Automation platform", def:"A no-code/low-code tool (e.g. Zapier, Make) that connects other systems together without custom API development."},
  {term:"Native integration", def:"A built-in connection between two tools, provided by the vendor, that doesn't require a third-party automation platform."},
  {term:"Source of truth", def:"The one system treated as authoritative for a given piece of data — if customer info lives in five spreadsheets with no single source of truth, automation has nothing reliable to read from."},
  {term:"Handoff", def:"The point where work or information passes from one person, team, or system to another — most operational waste happens at these transition points, not inside any one department."},
  {term:"Human-in-the-loop / required approval", def:"A step where automation stops and waits for a person to review or approve before continuing — used for high-stakes decisions like pricing, contracts, or refunds."},
  {term:"Data sensitivity", def:"How confidential or regulated the information a workflow touches is — public info, confidential customer data, or regulated data (e.g. health or financial records) each require different levels of caution before automating."}
];

function sysCatLabel(v){ const c = SYS_CATEGORIES.find(c=>c.value===v); return c?c.label:v; }

function matchTool(nameText){
  if(!nameText) return null;
  const t = nameText.trim().toLowerCase();
  if(!t) return null;
  // Prefer the longest matching alias so more specific names (e.g. "monday crm") win over shorter overlaps (e.g. "monday")
  let best = null, bestLen = 0;
  TOOL_KB.forEach(kb=>{
    kb.aliases.forEach(a=>{
      if(t.includes(a) && a.length > bestLen){ best = kb; bestLen = a.length; }
    });
  });
  return best;
}
function matchAllTools(nameText){
  if(!nameText) return [];
  const t = nameText.trim().toLowerCase();
  if(!t) return [];
  const found = [];
  TOOL_KB.forEach(kb=>{
    if(kb.aliases.some(a=>t.includes(a)) && !found.includes(kb)) found.push(kb);
  });
  return found;
}

function matchSystemTool(id){
  const row = (answers.systems_inventory||[]).find(r=>r.id===id);
  if(!row) return;
  const kb = matchTool(row.name);
  const allMatches = matchAllTools(row.name);
  row.matchedTool = kb ? kb.name : null;
  row.matchedCategory = kb ? kb.category : null;
  row.matchedMethod = kb ? kb.method : null;
  row.matchedGap = kb ? kb.gap : null;
  row.multiMatch = allMatches.length > 1 ? allMatches.map(k=>k.name) : null;
  if(kb && !row.category) row.category = kb.category;
  syncSystemsInUse();
  persist(); render();
}
function applySuggestedCategory(id, cat){
  updateSystemFieldAndRender(id, 'category', cat);
}

function syncSystemsInUse(){
  const cats = [...new Set((answers.systems_inventory||[]).map(r=>r.category).filter(Boolean))];
  answers.systems_in_use = cats;
}
function addFromDropdown(selectEl){
  const val = selectEl.value;
  if(!val) return;
  if(!answers.systems_inventory) answers.systems_inventory = [];
  if(val === 'other'){
    answers.systems_inventory.push({
      id: 'sys-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),
      name: '', category: '', owner: '', connectedTo: [], apiAvailable: '', decision: '',
      isCustom: true, detailsOpen: false
    });
  } else {
    const kb = TOOL_KB[parseInt(val,10)];
    if(!kb) return;
    const already = answers.systems_inventory.some(r=>r.name===kb.name);
    if(already) return;
    answers.systems_inventory.push({
      id: 'sys-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),
      name: kb.name, category: kb.category, owner: '', connectedTo: [], apiAvailable: '', decision: '',
      matchedTool: kb.name, matchedCategory: kb.category, matchedMethod: kb.method, matchedGap: kb.gap,
      isCustom: false, detailsOpen: false
    });
  }
  selectEl.value = '';
  syncSystemsInUse();
  persist(); render();
}
function toggleRowDetails(id){
  const row = (answers.systems_inventory||[]).find(r=>r.id===id);
  if(row) row.detailsOpen = !row.detailsOpen;
  render();
}
function removeSystemRow(id){
  answers.systems_inventory = (answers.systems_inventory||[]).filter(r=>r.id!==id);
  syncSystemsInUse();
  persist(); render();
}
function updateSystemField(id, field, value){
  const row = (answers.systems_inventory||[]).find(r=>r.id===id);
  if(row) row[field] = value;
  if(field === 'category') syncSystemsInUse();
  persist();
}
function updateSystemFieldAndRender(id, field, value){
  updateSystemField(id, field, value);
  render();
}
function toggleSystemConnection(id, catValue){
  const row = (answers.systems_inventory||[]).find(r=>r.id===id);
  if(!row) return;
  row.connectedTo = row.connectedTo || [];
  if(row.connectedTo.includes(catValue)) row.connectedTo = row.connectedTo.filter(v=>v!==catValue);
  else row.connectedTo.push(catValue);
  persist(); render();
}

function passesShowIf(q, ans){
  const c = q.showIf;
  if(!c) return true;
  const val = ans[c.field];
  if('equals' in c) return val === c.equals;
  if('not_equals' in c) return val !== undefined && val !== c.not_equals;
  if('not_in' in c) return val !== undefined && !c.not_in.includes(val);
  if('includes' in c) return Array.isArray(val) && val.includes(c.includes);
  return true;
}
function getVisible(ans){ return Q.filter(q => passesShowIf(q, ans)); }
function findQ(id){ return Q.find(q=>q.id===id); }
function labelFor(q, val){ if(!q||!q.options) return val; const o=q.options.find(o=>o.value===val); return o?o.label:val; }
function labelsFor(q, vals){ if(!q||!q.options||!vals) return []; return vals.map(v=>labelFor(q,v)).filter(v=>v); }

function scoreQuestion(q, ans){
  if(!q.scored) return null;
  const a = ans[q.id];
  if(q.type === 'yesno'){
    if(a === undefined) return 0;
    let v = a ? 1 : 0;
    if(q.invert) v = 1 - v;
    return v;
  }
  if(q.type === 'select'){
    if(a === undefined) return 0;
    if(q.negative && a === q.negative) return 0;
    return 1;
  }
  if(q.type === 'multiselect'){
    if(!a || a.length === 0) return 0;
    if(q.negative && a.includes(q.negative)) return 0;
    return 1;
  }
  if(q.type === 'text'){
    if(!a || !String(a).trim()) return 0;
    return 1;
  }
  return 0;
}
function computeScore(ans){
  const visible = getVisible(ans);
  let total=0,count=0;
  visible.forEach(q=>{ const s=scoreQuestion(q,ans); if(s!==null){total+=s;count++;} });
  return count===0?0:Math.round((total/count)*100);
}
function levelForScore(score){
  let lvl=LEVELS[0], idx=0;
  LEVELS.forEach((l,i)=>{ if(score>=l.min){lvl=l;idx=i;} });
  return {idx:idx+1, ...lvl};
}
function sectionStats(section, ans){
  const visible = getVisible(ans).filter(q=>q.section===section && q.scored);
  const total = visible.length;
  const done = visible.filter(q=>scoreQuestion(q,ans)===1).length;
  return {total, done, pct: total?Math.round((done/total)*100):100};
}

let saveTimer=null;
function persist(){

function readFileAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function handleFiles(inputEl, questionId){
  const files = Array.from(inputEl.files || []);
  if(!files.length) return;
  const q = findQ(questionId);
  let stored = answers[questionId+'_files'] || [];
  for(const file of files){
    const id = questionId + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,7);
    if(file.size > MAX_FILE_BYTES){
      stored.push({id, name:file.name, type:file.type, size:file.size, tooLarge:true});
    } else {
      try{
        const dataUrl = await readFileAsDataURL(file);
        await window.storage.set('sif-'+id, dataUrl, false);
        stored.push({id, name:file.name, type:file.type, size:file.size, hasData:true});
      }catch(e){
        stored.push({id, name:file.name, type:file.type, size:file.size, tooLarge:true});
      }
    }
  }
  answers[questionId+'_files'] = stored;
  if(q.type === 'yesno') answers[questionId] = true;
  persist();
  render();
}

async function removeFile(questionId, fileId){
  let stored = answers[questionId+'_files'] || [];
  stored = stored.filter(f=>f.id!==fileId);
  answers[questionId+'_files'] = stored;
  try{ await window.storage.delete('sif-'+fileId, false); }catch(e){}
  persist();
  render();
}

async function downloadFile(fileId, name){
  try{
    const res = await window.storage.get('sif-'+fileId, false);
    if(res && res.value){
      const a = document.createElement('a');
      a.href = res.value;
      a.download = name;
      a.click();
    }
  }catch(e){ alert('Could not retrieve that file.'); }
}

    arr = arr.filter(v=>v!==negativeVal);

function fmtSize(bytes){
  if(bytes > 1024*1024) return (bytes/(1024*1024)).toFixed(1)+' MB';
  return Math.round(bytes/1024)+' KB';
}

function presentCategories(){
  const fromInventory = (answers.systems_inventory||[]).map(r=>r.category).filter(Boolean);
  const sysQ = findQ('systems_in_use');
  const fromMultiselect = answers.systems_in_use || [];
  return [...new Set([...fromInventory, ...fromMultiselect])];
}
function systemNameForCategory(cat){
  const row = (answers.systems_inventory||[]).find(r=>r.category===cat && r.name && r.name.trim());
  return row ? row.name : sysCatLabel(cat);
}
function fillFixTemplate(fix, requires){
  let out = fix;
  (requires||[]).forEach(cat=>{
    out = out.split('{'+cat+'}').join(systemNameForCategory(cat));
  });
  return out;
}
function computeGoalFits(){
  const present = presentCategories();
  const goals = answers.automation_goals || [];
  const goalsQ = findQ('automation_goals');
  const results = [];
  const usedCategoryPairs = new Set();
  goals.forEach(g=>{
    const options = GOAL_RECS[g] || [];
    let matched = options.find(o => o.requires && o.requires.every(cat => present.includes(cat)));
    if(!matched) matched = options.find(o => o.fallback);
    if(matched){
      const fixText = matched.requires ? fillFixTemplate(matched.fix, matched.requires) : matched.fallback;
      results.push({goalLabel: labelFor(goalsQ, g), fix: fixText, specific: !!matched.requires});
      if(matched.requires && matched.requires.length===2) usedCategoryPairs.add([...matched.requires].sort().join('|'));
    }
  });
  return {results, usedCategoryPairs};
}
function computeUpsell(usedCategoryPairs){
  const rows = answers.systems_inventory || [];
  const present = presentCategories();
  const upsell = [];
  COMMON_CONNECTIONS.forEach(pair=>{
    if(present.includes(pair.a) && present.includes(pair.b)){
      const pairKey = [pair.a,pair.b].sort().join('|');
      if(usedCategoryPairs.has(pairKey)) return;
      const alreadyLinked = rows.some(r =>
        (r.category===pair.a && (r.connectedTo||[]).includes(pair.b)) ||
        (r.category===pair.b && (r.connectedTo||[]).includes(pair.a))
      );
      if(!alreadyLinked){
        upsell.push({label: sysCatLabel(pair.a)+' ↔ '+sysCatLabel(pair.b), note: pair.note});
      }
    }
  });
  return upsell;
}

  COMMON_CONNECTIONS.forEach(pair=>{
    if(presentCats.includes(pair.a) && presentCats.includes(pair.b)){

    <details class="glossary" id="glossary" ${glossaryOpen?'open':''} ontoggle="glossaryOpen=this.open">
      <summary>Glossary — terms used throughout this tool</summary>
      <div class="glossary-body">
        <div class="glossary-grid">${GLOSSARY.map(g=>`<div class="glossary-term"><b>${g.term}</b> — ${g.def}</div>`).join('')}</div>
      </div>
    </details>

    <div class="overall-card">
      <svg class="overall-ring" viewBox="0 0 56 56">
        <circle cx="28" cy="28" r="22" fill="none" stroke="rgba(8,12,18,0.08)" stroke-width="6"/>
        <circle cx="28" cy="28" r="22" fill="none" stroke="url(#og)" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="${circ}" stroke-dashoffset="${offset}" transform="rotate(-90 28 28)"/>
        <defs><linearGradient id="og" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2277D1"/><stop offset="100%" stop-color="#5FC597"/></linearGradient></defs>
        <text x="28" y="33" text-anchor="middle" class="overall-ring-text">${overall}%</text>
      </svg>
      <div>
        <div class="overall-label">${lvl.name}</div>
        <div class="overall-count">${lvl.desc}</div>
      </div>
      <button class="brief-btn" onclick="showReport()">View my automation plan →</button>
    </div>

    ${sectionsHtml}

    <div class="footer-tools">
      <button class="restart-btn" onclick="restart()">Clear all progress</button>
      <div class="save-note">Saves automatically</div>
    </div>
  `;
}

function renderReport(){
  const score = computeScore(answers);
  const lvl = levelForScore(score);
  const visible = getVisible(answers);
  const circumference = 314.2;
  const offset = circumference - (score/100)*circumference;

  function fileNote(qid){
    const files = answers[qid+'_files'] || [];
    if(!files.length) return '';
    return ' — ' + files.map(f=>f.name).join(', ');
  }

  const painQ = findQ('top_pain_departments');
  const painLabels = labelsFor(painQ, answers.top_pain_departments);
  const goalsQ = findQ('automation_goals');
  const goalsLabels = labelsFor(goalsQ, answers.automation_goals);
  const pitch = `We want to reduce ${answers.goal_text || '[the specific repetitive work or delay]'} — concentrated in ${painLabels.length?painLabels.join(', '):'[the departments feeling it most]'} — so that ${goalsLabels.length?goalsLabels.join(', ').toLowerCase():'[the desired outcome]'} happens automatically, while ${answers.decision_owner || '[the right person]'} keeps final say over pricing, contracts, and other high-stakes decisions.`;

  const sysLabels = presentCategories().map(sysCatLabel);
  const connQ = findQ('connection_method');
  const connLabels = labelsFor(connQ, answers.connection_method);
  let systemsHtml = `<ul style="margin:0;padding-left:18px;font-size:14px;line-height:1.9;">`;
  systemsHtml += `<li>Systems in use: <b>${sysLabels.length?sysLabels.join(', '):'None selected'}${fileNote('systems_in_use')}</b></li>`;
  systemsHtml += `<li>How they connect: <b>${connLabels.length?connLabels.join(', '):'Not answered'}</b></li>`;
  systemsHtml += `<li>Clear system ownership: <b>${answers.system_owner_known===true?'Yes':answers.system_owner_known===false?'No — needs to be sorted out':'Not answered'}</b></li>`;
  systemsHtml += `</ul>`;

  const invRows = answers.systems_inventory || [];
  if(invRows.length){
    const apiLbl = {yes:'API/webhook available',no:'No API/webhook',unsure:'API status unknown'};
    const decLbl = {keep:'Keep',replace:'Replace',consolidate:'Consolidate',retire:'Retire',unsure:'Decision pending'};
    systemsHtml += `<div style="margin-top:14px;">`;
    invRows.forEach(r=>{
      const connLabels2 = (r.connectedTo||[]).map(sysCatLabel);
      systemsHtml += `<div style="border-bottom:1px solid var(--line);padding:10px 0;font-size:13px;">
        <b>${r.name || 'Unnamed system'}</b> <span style="color:rgba(8,12,18,0.5);">(${sysCatLabel(r.category)||'uncategorized'})</span><br>
        <span style="color:rgba(8,12,18,0.6);">
          ${r.owner?('Owner: '+r.owner+' · '):''}
          ${connLabels2.length ? ('Connects to: '+connLabels2.join(', ')+' · ') : 'Not connected to anything yet · '}
          ${r.apiAvailable ? apiLbl[r.apiAvailable] : 'API status unknown'} ·
          ${r.decision ? decLbl[r.decision] : 'Decision pending'}
        </span>
        ${r.matchedGap ? `<div style="margin-top:4px;font-size:12px;color:#a8781f;">⚡ ${r.matchedGap}</div>` : ''}
      </div>`;
    });
    systemsHtml += `</div>`;
    const gapsPanel = renderCommonGapsPanel();
    if(gapsPanel) systemsHtml += gapsPanel;
  }

  const freqQ = findQ('frequency_of_worst');
  const budgetQ = findQ('has_budget_timeline');
  let priorityHtml = `<ul style="margin:0;padding-left:18px;font-size:14px;line-height:1.9;">`;
  priorityHtml += `<li>Biggest time sink: <b>${answers.worst_task_text || 'Not answered'}${answers.frequency_of_worst?(' — '+labelFor(freqQ,answers.frequency_of_worst)):''}</b></li>`;
  priorityHtml += `<li>90-day priority: <b>${answers.biggest_win_area || 'Not answered'}</b></li>`;
  priorityHtml += `<li>Status: <b>${labelFor(budgetQ, answers.has_budget_timeline) || 'Not answered'}</b></li>`;
  if(answers.process_documented !== undefined){
    priorityHtml += `<li>Process documented: <b>${answers.process_documented?'Yes':'No — worth writing down before automating'}${fileNote('process_documented')}</b></li>`;
  }
  if(answers.source_of_truth_defined !== undefined){
    priorityHtml += `<li>Single source of truth: <b>${answers.source_of_truth_defined?'Defined':'Scattered across tools/spreadsheets'}</b></li>`;
  }
  priorityHtml += `</ul>`;

  const {results: goalFits, usedCategoryPairs} = computeGoalFits();
  let goalFitHtml = '';
  if(goalFits.length){
    goalFitHtml = goalFits.map(gf=>`
      <div style="border-bottom:1px solid var(--line);padding:12px 0;">
        <p style="margin:0 0 4px;font-size:13px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.04em;text-transform:uppercase;color:var(--sage);">GOAL: ${gf.goalLabel}</p>
        <p style="margin:0;font-size:14px;line-height:1.55;color:var(--ink);">${gf.fix}${gf.specific?'':' <span style="color:rgba(8,12,18,0.45);font-size:12px;">(general guidance — add systems to the inventory above for a more specific fit)</span>'}</p>
      </div>`).join('');
  } else {
    goalFitHtml = '<p style="font-size:14px;color:rgba(8,12,18,0.6);">No goals selected yet — pick from Automation Goals to see matched recommendations here.</p>';
  }

  const upsell = computeUpsell(usedCategoryPairs);
  let upsellHtml = '';
  if(upsell.length){
    upsellHtml = upsell.map(u=>`<div style="background:rgba(95,197,151,0.08);border-left:2px solid var(--sage);border-radius:0 8px 8px 0;padding:12px 14px;margin-bottom:8px;">
      <p style="margin:0 0 3px;font-size:13px;font-weight:600;color:var(--navy);">${u.label}</p>
      <p style="margin:0;font-size:12.5px;color:rgba(8,12,18,0.7);line-height:1.5;">${u.note}</p>
    </div>`).join('');
  }

  const approvalQ = findQ('requires_human_approval');
  const approvalLabels = labelsFor(approvalQ, answers.requires_human_approval);
  const aiOkQ = findQ('ai_ok_for');
  const aiOkLabels = labelsFor(aiOkQ, answers.ai_ok_for);
  const sensitivityQ = findQ('data_sensitivity');
  let guardrailsHtml = `<ul style="margin:0;padding-left:18px;font-size:14px;line-height:1.9;">`;
  guardrailsHtml += `<li>Good first AI use cases: <b>${aiOkLabels.length?aiOkLabels.join(', '):'Not answered'}</b></li>`;
  guardrailsHtml += `<li>Always requires a human: <b>${approvalLabels.length?approvalLabels.join(', '):'Not answered'}</b></li>`;
  guardrailsHtml += `<li>Data sensitivity: <b>${labelFor(sensitivityQ, answers.data_sensitivity) || 'Not answered'}</b></li>`;
  guardrailsHtml += `</ul>`;

  let gapsBySection = {};
  visible.forEach(q=>{
    const s = scoreQuestion(q, answers);
    if(s === 0){ gapsBySection[q.section] = gapsBySection[q.section]||[]; gapsBySection[q.section].push(q); }
  });
  let gapsHtml = '';
  SECTIONS.forEach(sec=>{
    if(gapsBySection[sec] && gapsBySection[sec].length){
      gapsHtml += `<div class="gap-section">${sec}</div>`;
      gapsBySection[sec].forEach(q=>{
        gapsHtml += `<div class="gap-item"><div class="gap-dot"></div><div class="gap-body"><b>${q.prompt}</b><p>${q.why}</p></div></div>`;
      });
    }
  });
  if(!gapsHtml) gapsHtml = '<p style="font-size:14px;color:rgba(8,12,18,0.6);">Nothing outstanding — ready to design the first workflow.</p>';

  const wrap = document.getElementById('wrap');
  wrap.innerHTML = `
    <p class="top-eyebrow">Your personalized automation plan</p>
    <h1 class="top-title">AI Workflow Readiness Brief</h1>

    <div class="report-gauge">
      <svg class="gauge-svg" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(8,12,18,0.08)" stroke-width="9"/>
        <circle cx="60" cy="60" r="50" fill="none" stroke="url(#g1)" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" transform="rotate(-90 60 60)"/>
        <defs><linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2277D1"/><stop offset="100%" stop-color="#5FC597"/></linearGradient></defs>
        <text x="60" y="66" text-anchor="middle" class="gauge-score">${score}%</text>
      </svg>
      <div>
        <div class="report-level">${lvl.name}</div>
        <div class="report-level-desc">${lvl.desc}</div>
      </div>
    </div>

    <div class="report-block">
      <p class="report-h">Automation Goal Statement</p>
      <div class="pitch-text" id="pitchText">${pitch}</div>
      <button class="copy-btn" onclick="copyPitch()">Copy this text</button>
    </div>

    <div class="report-block"><p class="report-h">Systems Inventory</p>${systemsHtml}</div>
    <div class="report-block"><p class="report-h">Recommended Fits For Your Goals</p>${goalFitHtml}</div>
    ${upsell.length ? `<div class="report-block"><p class="report-h">Also Worth Considering</p>${upsellHtml}</div>` : ''}
    <div class="report-block"><p class="report-h">Priority Focus</p>${priorityHtml}</div>
    <div class="report-block"><p class="report-h">AI and human approval</p>${guardrailsHtml}</div>
    <div class="report-block"><p class="report-h">Still Open Before the First Workflow Gets Built</p>${gapsHtml}</div>

    <div class="report-block">
      <p class="report-h">Share This Brief</p>
      ${shareFormOpen ? `
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
          <input class="text-input" style="flex:1;min-width:160px;" type="text" id="shareName" placeholder="Your name">
          <input class="text-input" style="flex:1;min-width:160px;" type="email" id="shareEmail" placeholder="Email">
        </div>
        <button class="copy-btn" onclick="submitShare()">Send to Andrew</button>
        <span class="sample-note" style="margin-left:8px;">${shareStatus}</span>
      ` : `
        <button class="sample-btn" type="button" onclick="toggleShareForm()">Share this brief with Andrew</button>
        <span class="sample-note" style="margin-left:8px;">Optional — sends your name, email, and this brief. Nothing else leaves your browser.</span>
      `}
    </div>

    ${sampleLoaded ? '<div class="hiw-note" style="background:rgba(224,168,62,0.12);border:1px solid rgba(224,168,62,0.4);border-radius:8px;padding:10px 14px;margin-bottom:16px;">This is a sample brief built from example data, not your real answers.</div>' : ''}
    <div class="hiw-note" style="margin-bottom:16px;">This brief is informational only and not a substitute for professional IT, security, or legal consultation before implementing AI systems that handle sensitive data. AK Randall Digital LLC &middot; <a href="mailto:andrew@akrandall.com">andrew@akrandall.com</a> &middot; 336&ndash;437&ndash;4484</div>

    <button class="restart-btn" onclick="showRoadmap()">← Back to roadmap</button>
  `;
}

const SAMPLE_ANSWERS = {
  goal_text: "Quotes take two days to go out because pricing has to be rebuilt by hand for every lead.",
  top_pain_departments: ["sales", "ops"],
  automation_goals: ["lead_response", "quoting", "followups"],
  decision_owner: "Owner (final say on pricing and contract terms)",
  systems_inventory: [
    {id:"sample-1", name:"HubSpot", category:"crm", owner:"Sales manager", connectedTo:["website"], apiAvailable:"yes", decision:"keep", matchedTool:"HubSpot", matchedCategory:"crm", matchedMethod:"Native integration (broad marketplace)", matchedGap:"Has one of the widest native app marketplaces available — if it's not connected to the website or accounting tool, that's usually a setup gap, not a technical limitation.", isCustom:false, detailsOpen:false},
    {id:"sample-2", name:"QuickBooks", category:"accounting", owner:"Bookkeeper", connectedTo:[], apiAvailable:"unsure", decision:"keep", matchedTool:"QuickBooks", matchedCategory:"accounting", matchedMethod:"Native integration or Zapier/Make", matchedGap:"Commonly left disconnected from the CRM or e-commerce platform, so revenue and customer records drift apart from what sales sees.", isCustom:false, detailsOpen:false},
    {id:"sample-3", name:"Squarespace", category:"website", owner:"Owner", connectedTo:[], apiAvailable:"unsure", decision:"keep", matchedTool:"Squarespace", matchedCategory:"website", matchedMethod:"Zapier/Make (limited native CRM options)", matchedGap:"Native CRM integrations are limited — form submissions commonly just land in an inbox instead of a CRM record.", isCustom:false, detailsOpen:false}
  ],
  systems_in_use: ["crm","accounting","website"],
  connection_method: ["manual_only"],
  system_owner_known: true,
  repetitive_tasks: ["copy_form","manual_invoices","rewrite_proposals","stale_followup"],
  worst_task_text: "Rebuilding a proposal from scratch for every new lead instead of starting from a template.",
  frequency_of_worst: "weekly",
  handoff_pain_points: ["web_crm","sales_finance"],
  customers_repeat_info: false,
  process_documented: false,
  source_of_truth_defined: false,
  ai_ok_for: ["drafting","classifying"],
  requires_human_approval: ["pricing","contracts","refunds"],
  data_sensitivity: "confidential",
  biggest_win_area: "Auto-create a CRM record the moment a website form is submitted, and fire an internal alert so sales responds same-day.",
  has_budget_timeline: "ready"
};

function loadSampleData(){
  const hasData = Object.keys(answers).some(k=>{
    const v = answers[k];
    if(v === undefined || v === null || v === '') return false;
    if(Array.isArray(v)) return v.length > 0;
    return true;
  });
  if(hasData && !confirm('This loads example data so you can preview a finished automation plan — it will overwrite your current answers. Continue?')) return;
  answers = JSON.parse(JSON.stringify(SAMPLE_ANSWERS));
  sampleLoaded = true;
  persist();
  view = 'report';
  render();
}
function clearSampleData(){
  if(!confirm('Clear the sample data and return to a blank roadmap?')) return;
  answers = {};
  sampleLoaded = false;
  persist();
  view = 'roadmap';
  render();
}

function copyPitch(){ const t=document.getElementById('pitchText').innerText; navigator.clipboard && navigator.clipboard.writeText(t); }
function showReport(){ view='report'; renderReport(); }
function showRoadmap(){ view='roadmap'; render(); }

async function restart(){
  if(!confirm('Clear all roadmap progress and attached files? This cannot be undone.')) return;
  const fileKeys = [];
  Object.keys(answers).forEach(k=>{
    if(k.endsWith('_files') && Array.isArray(answers[k])) answers[k].forEach(f=>fileKeys.push(f.id));
  });
  for(const id of fileKeys){ try{ await window.storage.delete('sif-'+id, false); }catch(e){} }
  answers = {};
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify({answers}), false); }catch(e){}
  render();
}

function render(){
  if(view === 'report'){ renderReport(); return; }
  renderRoadmap();
}

load();

/* ---- report height to parent when embedded in an iframe (landing-page wrapper) ---- */
function reportHeightToParent(){
  try{ window.parent && window.parent !== window && window.parent.postMessage({type:"akrd-assessment-height", height:document.documentElement.scrollHeight}, "*"); }catch(e){}
}
window.addEventListener("load", reportHeightToParent);
if(window.ResizeObserver){
  new ResizeObserver(reportHeightToParent).observe(document.body);
} else {
  setInterval(reportHeightToParent, 600);
}
</script>
